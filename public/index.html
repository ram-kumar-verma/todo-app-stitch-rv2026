<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tasks</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Firebase SDKs -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
      import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
      import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, updateDoc, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";
      
      // Make Firebase accessible globally for app.js
      window.firebaseApp = { initializeApp, getAuth, signInAnonymously, onAuthStateChanged, getFirestore, collection, addDoc, onSnapshot, query, orderBy, updateDoc, deleteDoc, doc, serverTimestamp };
    </script>
</head>
<body>
    <div class="app-container">
        <header class="app-bar">
            <h1>My Tasks</h1>
        </header>

        <main class="content">
            <div id="loading" class="loading">Loading tasks...</div>
            <ul id="task-list" class="task-list">
                <!-- Tasks will be injected here by app.js -->
            </ul>
        </main>

        <button id="fab" class="fab" aria-label="Add Task">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>

        <div id="add-task-modal" class="modal hidden">
            <div class="modal-content">
                <h2>New Task</h2>
                <form id="add-task-form">
                    <input type="text" id="task-input" placeholder="What needs to be done?" required autocomplete="off">
                    <div class="modal-actions">
                        <button type="button" id="cancel-btn" class="btn-ghost">Cancel</button>
                        <button type="submit" id="save-btn" class="btn-primary">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="app.js" type="module"></script>
</body>
</html>
